# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  schedule:
    # Every day at 1:45 UTC
    - cron: 45 1 * * *
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Bump formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          TAP_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
        # Formulae pinned to a commit can't be bumped by version; bump-pinned.yml
        # handles those, so only pass the rest to brew bump.
        run: |
          pinned="$("$TAP_PATH/.github/scripts/bump-pinned-commits.sh" "$TAP_NAME" --list)"
          formulae=()
          for file in "$TAP_PATH"/Formula/*.rb; do
            name="$(basename "$file" .rb)"
            grep -qxF "$name" <<<"$pinned" || formulae+=("$TAP_NAME/$name")
          done
          if (( ${#formulae[@]} )); then
            brew bump --no-fork --open-pr --formulae "${formulae[@]}"
          fi
