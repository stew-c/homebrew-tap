# Repins formulae that track a branch commit (no upstream releases) when
# livecheck finds a newer commit, then builds and tests them before pushing.
# Release-based formulae are handled by autobump.yml instead.
name: bump pinned commits

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bump-pinned.yml
      - .github/scripts/bump-pinned-commits.sh
  schedule:
    # Every day at 2:15 UTC
    - cron: 15 2 * * *
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump-pinned

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  bump-pinned:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2

      - name: Bump, build and test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          TAP_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          bumped="$("$TAP_PATH/.github/scripts/bump-pinned-commits.sh" "$TAP_NAME")"
          while read -r name version; do
            [[ -n "$name" ]] || continue
            brew install --build-from-source "$TAP_NAME/$name"
            brew test "$TAP_NAME/$name"
            git -C "$TAP_PATH" commit -m "$name $version" -- "Formula/$name.rb"
          done <<<"$bumped"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: ${{ github.ref_name }}
